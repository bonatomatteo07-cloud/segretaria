<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Segretaria</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#EAF0F6;color:#1c2b3a;font:15px/1.4 system-ui,-apple-system,Roboto,sans-serif}
button{font:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;background:#EAF0F6}
header{background:#14325A;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;gap:12px}
header .av{width:46px;height:46px;border-radius:50%;overflow:hidden;background:#D6E4F5;border:0;padding:0;flex:none}
header .av svg{width:100%;height:100%}
header .t{flex:1}
header .d{font-size:12px;opacity:.8}
header .n{font-size:18px;font-weight:500}
header .g{background:none;border:0;color:#fff;font-size:22px;padding:6px}
main{flex:1;overflow-y:auto;padding:12px}
nav{display:flex;background:#fff;border-top:1px solid #cfd8e3;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;color:#7a8794;font-size:12px}
nav button.on{color:#14325A;font-weight:600}
nav button span{display:block;font-size:22px;line-height:1.1}
.card{background:#fff;border:1px solid #d5dde7;border-radius:12px;padding:11px 13px;margin-bottom:9px}
.row{display:flex;align-items:center;gap:10px}
.row .m{flex:1;min-width:0}
.row .a{font-weight:600}
.row .b{color:#5b6b7b;font-size:13px;overflow-wrap:anywhere}
.chip{display:inline-block;border-radius:10px;padding:2px 9px;font-size:12px;white-space:nowrap}
.c-blue{background:#D6E4F5;color:#14325A}.c-green{background:#DDF0DF;color:#1f5a2a}.c-gray{background:#E6E9ED;color:#3b4651}
.c-red{background:#F8D7D7;color:#8a1c1c}.c-or{background:#FBE3D0;color:#8a3d0c}
h3{margin:16px 2px 7px;font-size:15px;font-weight:600}
.ic{border:0;background:#E6E9ED;border-radius:8px;width:34px;height:34px;font-size:16px;flex:none}
.ic.ok{background:#DDF0DF}
.done .a,.done .b{text-decoration:line-through;opacity:.55}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;color:#fff;background:#14325A}
.btn.g{background:#2E8B57}.btn.s{background:#E6E9ED;color:#1c2b3a}
.btn.w{width:100%}
input,select,textarea{width:100%;font:inherit;border:1px solid #b9c6d6;border-radius:8px;padding:9px;background:#fff;color:#1c2b3a}
label{display:block;font-size:12px;color:#5b6b7b;margin:9px 0 3px}
.filt{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.filt button{border:1px solid #14325A;background:#fff;color:#14325A;border-radius:10px;padding:4px 12px;font-size:13px}
.filt button.on{background:#14325A;color:#fff}
.empty{text-align:center;color:#5b6b7b;padding:22px 10px}
.err{color:#a32d2d;font-size:13px;margin-top:6px}
#ov{position:fixed;inset:0;background:#EAF0F6;z-index:20;display:none;flex-direction:column;align-items:center;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));overflow-y:auto}
#ov.show{display:flex}
#ov .face{width:min(62vw,230px);aspect-ratio:240/300;border-radius:24px;overflow:hidden;flex:none;animation:bob 4s ease-in-out infinite}
#ov .face svg{width:100%;height:100%;display:block}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.bubble{background:#fff;border:1px solid #d5dde7;border-radius:16px;padding:12px 14px;margin:14px 0 10px;width:100%;max-width:440px;font-size:15px;line-height:1.5;white-space:pre-line}
.mic{width:76px;height:76px;border-radius:50%;border:0;background:#14325A;color:#fff;font-size:34px;flex:none}
.mic.live{background:#C0392B;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.hint{font-size:12px;color:#5b6b7b;margin:6px 0 10px;text-align:center}
.acts{display:flex;gap:8px;width:100%;max-width:440px;margin-top:8px}
.acts .btn{flex:1}
#toast{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));background:#14325A;color:#fff;border-radius:12px;padding:12px 14px;z-index:30;display:none}
</style>
</head>

<button class="av" id="hav" aria-label="Chiama la segretaria"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" preserveAspectRatio="xMidYMid slice"><rect width="240" height="300" fill="#D6E4F5"/><ellipse cx="120" cy="128" rx="66" ry="76" fill="#5B3A29"/><circle cx="120" cy="54" r="21" fill="#5B3A29"/><rect x="106" y="170" width="28" height="58" fill="#E9B88F"/><path d="M30 300 Q30 236 88 222 L152 222 Q210 236 210 300 Z" fill="#14325A"/><path d="M98 222 L120 268 L142 222 Z" fill="#fff"/><path d="M98 222 L120 268 L110 222Z" fill="#d9e3ef"/><ellipse cx="120" cy="122" rx="52" ry="60" fill="#F7D2B0"/><path d="M66 118 Q70 60 120 58 Q170 60 174 118 Q158 82 126 80 Q92 84 66 118Z" fill="#5B3A29"/><ellipse cx="86" cy="150" rx="10" ry="5.5" fill="#F29C98" opacity=".65"/><ellipse cx="154" cy="150" rx="10" ry="5.5" fill="#F29C98" opacity=".65"/><g class="eyes"><ellipse cx="99" cy="123" rx="9.5" ry="11.5" fill="#fff"/><circle cx="100" cy="125" r="7.6" fill="#3b2418"/><circle cx="97.5" cy="121.5" r="3" fill="#fff"/><circle cx="102.5" cy="128" r="1.4" fill="#fff"/><ellipse cx="141" cy="123" rx="9.5" ry="11.5" fill="#fff"/><circle cx="142" cy="125" r="7.6" fill="#3b2418"/><circle cx="139.5" cy="121.5" r="3" fill="#fff"/><circle cx="144.5" cy="128" r="1.4" fill="#fff"/></g><path d="M88 112 Q99 106 109 111" stroke="#3b2418" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M131 111 Q141 106 152 112" stroke="#3b2418" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M118 138 Q120 142 122 138" stroke="#d99a78" stroke-width="2" fill="none" stroke-linecap="round"/><path class="mclosed" d="M108 151 Q120 163 132 151" stroke="#b5483f" stroke-width="3.2" fill="#fff" stroke-linecap="round" stroke-linejoin="round"/><g class="mopen" style="display:none"><ellipse cx="120" cy="156" rx="9" ry="7" fill="#8a2f2a"/><path d="M111 153 Q120 150 129 153 L129 155 Q120 153 111 155Z" fill="#fff"/><ellipse cx="120" cy="160" rx="5" ry="2.8" fill="#e8726c"/></g><circle cx="6 </button>
<div class="t"><div class="d" id="hd"></div><div class="n" id="hn"></div></div>
<button class="g" id="gear" aria-label="Impostazioni">&#9881;</button>
</header>
<main id="main"></main>
<nav>

</nav>
</div>

<div id="ov">
<div class="face" id="face"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" preserveAspectRatio="xMidYMid slice"><rect width="240" height="300" fill="#D6E4F5"/><ellipse cx="120" cy="128" rx="66" ry="76" fill="#5B3A29"/><circle cx="120" cy="54" r="21" fill="#5B3A29"/><rect x="106" y="170" width="28" height="58" fill="#E9B88F"/><path d="M30 300 Q30 236 88 222 L152 222 Q210 236 210 300 Z" fill="#14325A"/><path d="M98 222 L120 268 L142 222 Z" fill="#fff"/><path d="M98 222 L120 268 L110 222Z" fill="#d9e3ef"/><ellipse cx="120" cy="122" rx="52" ry="60" fill="#F7D2B0"/><path d="M66 118 Q70 60 120 58 Q170 60 174 118 Q158 82 126 80 Q92 84 66 118Z" fill="#5B3A29"/><ellipse cx="86" cy="150" rx="10" ry="5.5" fill="#F29C98" opacity=".65"/><ellipse cx="154" cy="150" rx="10" ry="5.5" fill="#F29C98" opacity=".65"/><g class="eyes"><ellipse cx="99" cy="123" rx="9.5" ry="11.5" fill="#fff"/><circle cx="100" cy="125" r="7.6" fill="#3b2418"/><circle cx="97.5" cy="121.5" r="3" fill="#fff"/><circle cx="102.5" cy="128" r="1.4" fill="#fff"/><ellipse cx="141" cy="123" rx="9.5" ry="11.5" fill="#fff"/><circle cx="142" cy="125" r="7.6" fill="#3b2418"/><circle cx="139.5" cy="121.5" r="3" fill="#fff"/><circle cx="144.5" cy="128" r="1.4" fill="#fff"/></g><path d="M88 112 Q99 106 109 111" stroke="#3b2418" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M131 111 Q141 106 152 112" stroke="#3b2418" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M118 138 Q120 142 122 138" stroke="#d99a78" stroke-width="2" fill="none" stroke-linecap="round"/><path class="mclosed" d="M108 151 Q120 163 132 151" stroke="#b5483f" stroke-width="3.2" fill="#fff" stroke-linecap="round" stroke-linejoin="round"/><g class="mopen" style="display:none"><ellipse cx="120" cy="156" rx="9" ry="7" fill="#8a2f2a"/><path d="M111 153 Q120 150 129 153 L129 155 Q120 153 111 155Z" fill="#fff"/><ellipse cx="120" cy="160" rx="5" ry="2.8" fill="#e8726c"/></g><circle cx="69" cy="148" r="3.4" fill="#E8B84A"/><circle cx="171" cy="148" r="3.4" fill="#E8B84A"/><path d="M66 120 Q66 64 120 64 Q174 64 174 120" stroke="#2a3340" stroke-width="5" fill="none"/><rect x="60" y="112" width="11" height="28" rx="5.5" fill="#2a3340"/><rect x="169" y="112" width="11" height="28" rx="5.5" fill="#2a3340"/><path d="M175 138 Q178 170 142 168" stroke="#2a3340" stroke-width="3" fill="none"/><circle cx="139" cy="168" r="5" fill="#2a3340"/></svg>

<script>
var $=function(i){return document.getElementById(i)};
var GIORNI=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
var MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
var STORE='segretaria_v1';
var db;try{db=JSON.parse(localStorage.getItem(STORE))||{}}catch(e){db={}}
db.items=db.items||[];db.user=db.user||'Marco';
function save(){try{localStorage.setItem(STORE,JSON.stringify(db))}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* ---------- date ---------- */
function pad(n){return n<10?'0'+n:''+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function sod(d){var x=new Date(d);x.setHours(0,0,0,0);return x}
function fromIso(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function diffDays(s){return Math.round((fromIso(s)-sod(new Date()))/864e5)}
function prettyDate(s){var d=fromIso(s),n=diffDays(s);
 if(n===0)return 'oggi';if(n===1)return 'domani';if(n===2)return 'dopodomani';
 return GIORNI[d.getDay()]+' '+d.getDate()+' '+MESI[d.getMonth()]}
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function timeSpeech(t){var p=t.split(':'),h=+p[0],m=+p[1];return 'alle '+h+(m?' e '+m:'')}

/* ---------- capire la frase ---------- */
var STOP={};('polizza polizze auto casa vita infortuni moto rinnovo rinnovare scadenza scade scadono appuntamento incontro visita domani oggi dopodomani stasera alle ore il la lo le i gli un una e a in per con di del della dal dalla da tra giorni giorno settimana settimane mese mesi mattina pomeriggio sera mezza mezzo mezzogiorno ricordami ricorda segna segnami fissa metti nota ho abbiamo devo dobbiamo che prossimo prossima questa questo fine lunedi martedi mercoledi giovedi venerdi sabato domenica '+MESI.join(' ')+' spedizione ritirare consegnare consegna pratica').split(' ').forEach(function(w){STOP[w]=1});
var TRIG={con:1,per:1,di:1,del:1,della:1,dal:1,dalla:1,da:1,cliente:1,sig:1,signor:1,signora:1,dott:1,dottor:1,dottoressa:1,chiamare:1,chiama:1,telefonare:1,telefona:1,incontrare:1,vedere:1,sentire:1};
var SKIP={il:1,la:1,lo:1,i:1,gli:1,le:1,sig:1,signor:1,signora:1,dott:1,dottor:1,dottoressa:1,cliente:1,"sig.":1};
function cap(s){return s.replace(/(^|\s)(\S)/g,function(m,a,b){return a+b.toUpperCase()})}
function parse(raw){
 var tk=raw.replace(/[,;!?]/g,' ').split(/\s+/).filter(Boolean),nt=tk.map(norm);
 var t=' '+nt.join(' ')+' ',now=sod(new Date()),date=null,time='',m;
 if(/\bmezzogiorno\b/.test(t)){time='12:00';t=t.replace(/\bmezzogiorno\b/,' ')}
 m=t.match(/\b(?:alle|ore|all)\s*(\d{1,2})(?:[:.h](\d{2}))?(?:\s*e\s*(mezza|mezzo|un quarto|quarantacinque|trenta|quindici))?/)||t.match(/\b(\d{1,2}):(\d{2})\b/);
 if(m){var h=+m[1],mi=+(m[2]||0),x=m[3];if(x){mi=/mezz|trenta/.test(x)?30:/quarto|quindici/.test(x)?15:45}
  if(/pomeriggio|sera/.test(t)&&h<12)h+=12;else if(h>=1&&h<=6&&!/mattina|notte/.test(t))h+=12;
  if(h<24&&mi<60)time=pad(h)+':'+pad(mi);t=t.replace(m[0],' ')}
 var re=MESI.map(norm).join('|');
 if(m=t.match(new RegExp('\\b(\\d{1,2})\\s*(?:di\\s+)?('+re+')(?:\\s+(\\d{4}))?\\b'))){
  var mo=norm(MESI.join(' ')).split(' ').indexOf(m[2]),y=m[3]?+m[3]:now.getFullYear();date=new Date(y,mo,+m[1]);
  if(!m[3]&&date<now)date=new Date(y+1,mo,+m[1]);t=t.replace(m[0],' ')}
 else if(m=t.match(/\b(\d{1,2})\s*[\/\-]\s*(\d{1,2})(?:\s*[\/\-]\s*(\d{2,4}))?\b/)){
  var y2=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):now.getFullYear();date=new Date(y2,+m[2]-1,+m[1]);
  if(!m[3]&&date<now)date=new Date(y2+1,+m[2]-1,+m[1]);t=t.replace(m[0],' ')}
 else if(/\bdopodomani\b/.test(t))date=addDays(now,2);
 else if(/\bdomani\b/.test(t))date=addDays(now,1);
 else if(/\b(oggi|stasera|stamattina|stamani)\b/.test(t))date=now;
 else if(m=t.match(/\btra\s+(\d+|un|una)\s+(giorn\w*|settiman\w*|mes\w*)/)){var n=/^\d/.test(m[1])?+m[1]:1;
  date=/giorn/.test(m[2])?addDays(now,n):/settiman/.test(m[2])?addDays(now,7*n):new Date(now.getFullYear(),now.getMonth()+n,now.getDate())}
 else if(m=t.match(/\b(lunedi|martedi|mercoledi|giovedi|venerdi|sabato|domenica)\b/)){
  var wd=norm(GIORNI.join(' ')).split(' ').indexOf(m[1]),dd=(wd-now.getDay()+7)%7;if(dd===0)dd=7;date=addDays(now,dd)}
 else if(/\bfine\s+(?:del\s+)?mese\b/.test(t))date=new Date(now.getFullYear(),now.getMonth()+1,0);
 else if(m=t.match(/\bil\s+(\d{1,2})\b/)){date=new Date(now.getFullYear(),now.getMonth(),+m[1]);if(date<now)date=new Date(now.getFullYear(),now.getMonth()+1,+m[1])}
 var tipo=/appuntament|incontr|visita|riunion/.test(t)?'app':/polizz|scadenz|scad|rinnov/.test(t)?'pol':time?'app':'att';
 var ramo=/\b(auto|macchina|moto|rca)\b/.test(t)?'Auto':/\b(casa|abitazione)\b/.test(t)?'Casa':/\bvita\b/.test(t)?'Vita':/infortun/.test(t)?'Infortuni':'';
 var cli='';
 for(var i=0;i<nt.length&&!cli;i++){if(!TRIG[nt[i]])continue;var j=i+1,w=[];
  while(j<nt.length&&SKIP[nt[j]])j++;
  while(j<nt.length&&w.length<2&&!STOP[nt[j]]&&!/\d/.test(nt[j])&&!TRIG[nt[j]]){w.push(tk[j]);j++}
  if(w.length)cli=cap(w.join(' ').replace(/[.]/g,''))}
 return{tipo:tipo,ramo:ramo,cliente:cli,date:date?iso(date):'',time:time,nota:raw.trim()};
}
function describe(it){
 var k=it.tipo==='app'?'un appuntamento':it.tipo==='pol'?'una scadenza di polizza'+(it.ramo?' '+it.ramo.toLowerCase():''):'un\'attività';
 return k+(it.cliente?' con '+it.cliente:'')+(it.date?', '+prettyDate(it.date):'')+(it.time?', '+timeSpeech(it.time):'')}

/* ---------- voce ---------- */
var voice=null,speaking=false;
function pickVoice(){var v=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
 voice=v.filter(function(x){return /^it/i.test(x.lang)}).sort(function(a,b){return (/Google|Natural|Neural/i.test(b.name)?1:0)-(/Google|Natural|Neural/i.test(a.name)?1:0)})[0]||null}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
var mouthT=null;
function mouth(on){document.querySelectorAll('.mopen').forEach(function(e){e.style.display='none'});
 document.querySelectorAll('.mclosed').forEach(function(e){e.style.display=''});
 clearInterval(mouthT);if(!on)return;var o=false;
 mouthT=setInterval(function(){o=!o;document.querySelectorAll('#ov .mopen').forEach(function(e){e.style.display=o?'':'none'});
  document.querySelectorAll('#ov .mclosed').forEach(function(e){e.style.display=o?'none':''})},170)}
function say(text,done){
 if(!window.speechSynthesis){done&&done();return}
 speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang='it-IT';if(voice)u.voice=voice;u.rate=1;u.pitch=1.1;
 u.onstart=function(){speaking=true;mouth(true)};
 u.onend=u.onerror=function(){speaking=false;mouth(false);done&&done()};
 speechSynthesis.speak(u);
}
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,rec=null;
function listen(cb,fail){
 if(!SR){fail&&fail('no');return}
 try{speechSynthesis.cancel()}catch(e){}
 rec=new SR();rec.lang='it-IT';rec.interimResults=false;rec.maxAlternatives=1;var got=false;
 rec.onresult=function(e){got=true;cb(e.results[0][0].transcript)};
 rec.onerror=function(e){fail&&fail(e.error)};
 rec.onend=function(){$('mic').classList.remove('live');if(!got&&fail)fail('vuoto')};
 $('mic').classList.add('live');try{rec.start()}catch(e){fail&&fail('err')}
}

/* ---------- agenda ---------- */
function sorted(a){return a.slice().sort(function(x,y){return (x.date+(x.time||'99:99')).localeCompare(y.date+(y.time||'99:99'))})}
function todayItems(){var t=iso(new Date());return sorted(db.items.filter(function(i){return i.date===t&&!i.done}))}
function polizze(){return sorted(db.items.filter(function(i){return i.tipo==='pol'&&!i.done&&diffDays(i.date)>=-30}))}
function soon(){return polizze().filter(function(i){return diffDays(i.date)<=30})}
function briefing(){
 var h=new Date().getHours(),g=h<13?'Buongiorno':h<18?'Buon pomeriggio':'Buonasera',s=g+' '+db.user+'. ';
 var td=todayItems(),pl=soon();
 if(!td.length)s+='Oggi non hai impegni in agenda. ';
 else{s+='Oggi hai '+td.length+(td.length>1?' impegni. ':' impegno. ');
  td.forEach(function(i){s+=(i.time?timeSpeech(i.time)+' ':'')+(i.cliente?i.cliente+', ':'')+(i.tipo==='pol'?'scadenza polizza':i.tipo==='app'?'appuntamento':i.nota)+'. '})}
 if(pl.length){s+='Attenzione alle polizze. ';pl.slice(0,5).forEach(function(i){var n=diffDays(i.date);
  s+='La polizza '+(i.ramo?i.ramo.toLowerCase()+' ':'')+(i.cliente?'di '+i.cliente+' ':'')+(n<0?'è scaduta da '+(-n)+' giorni. ':n===0?'scade oggi. ':n===1?'scade domani. ':'scade tra '+n+' giorni. ')})}
 return s.trim()}

var view=0,filt='Tutte';
function chipFor(i){if(i.tipo==='pol'){var n=diffDays(i.date);return '<span class="chip '+(n<=7?'c-red':n<=30?'c-or':'c-green')+'">'+(n<0?'scaduta':n===0?'oggi':n+(n===1?' giorno':' giorni'))+'</span>'}
 return '<span class="chip '+(i.tipo==='app'?'c-blue':'c-gray')+'">'+(i.tipo==='app'?'Cliente':'Altro')+'</span>'}
function itemHtml(i,showDate){
 var a=(i.time?i.time+' · ':'')+(i.cliente||(i.tipo==='pol'?'Polizza':i.tipo==='app'?'Appuntamento':(i.nota||'Attività')));
 var b=(showDate?prettyDate(i.date)+(i.tipo==='pol'?'':'')+' · ':'')+(i.tipo==='pol'?'Polizza '+(i.ramo||'')+', scade '+fromIso(i.date).toLocaleDateString('it-IT'):i.nota);
 return '<div class="card'+(i.done?' done':'')+'"><div class="row"><div class="m"><div class="a">'+esc(a)+'</div><div class="b">'+esc(b)+'</div></div>'+chipFor(i)+
 '<button class="ic" data-ics="'+i.id+'" aria-label="Metti nel calendario">&#128276;</button><button class="ic ok" data-ok="'+i.id+'" aria-label="Fatto">&#10003;</button><button class="ic" data-del="'+i.id+'" aria-label="Elimina">&#128465;</button></div></div>'}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function render(){
 var d=new Date();$('hd').textContent=GIORNI[d.getDay()][0].toUpperCase()+GIORNI[d.getDay()].slice(1)+' '+d.getDate()+' '+MESI[d.getMonth()];
 $('hn').textContent=(d.getHours()<13?'Buongiorno, ':d.getHours()<18?'Buon pomeriggio, ':'Buonasera, ')+db.user;
 for(var k=0;k<3;k++)$('n'+k).className=k===view?'on':'';
 var h='';
 if(view===0){var td=todayItems(),nx=sorted(db.items.filter(function(i){var n=diffDays(i.date);return i.tipo!=='pol'&&!i.done&&n>0&&n<=7})),sc=soon();
  h+='<span class="chip c-blue">'+td.length+' oggi</span> <span class="chip c-or">'+sc.length+' scadenze</span><h3>Oggi</h3>';
  h+=td.length?td.map(function(i){return itemHtml(i)}).join(''):'<div class="card empty">Nessun impegno per oggi.</div>';
  if(nx.length)h+='<h3>Prossimi giorni</h3>'+nx.map(function(i){return itemHtml(i,1)}).join('');
  if(sc.length)h+='<h3>Polizze in scadenza</h3>'+sc.map(function(i){return itemHtml(i,0)}).join('')}
 else if(view===1){var ra=['Tutte','Auto','Casa','Vita','Infortuni'];
  h+='<div class="filt">'+ra.map(function(r){return '<button data-f="'+r+'" class="'+(r===filt?'on':'')+'">'+r+'</button>'}).join('')+'</div>';
  var l=polizze().filter(function(i){return filt==='Tutte'||i.ramo===filt});
  h+=l.length?l.map(function(i){return itemHtml(i,0)}).join(''):'<div class="card empty">Nessuna polizza. Dillo alla segretaria o usa Aggiungi.</div>';
  h+='<button class="btn w" data-all="1">&#128276; Promemoria nel calendario (anche ad app chiusa)</button><div class="hint">Metti tutto nel Calendario del telefono: ti avvisa a 30, 15 e 3 giorni dalla scadenza</div>'}
 else h+=formHtml();
 $('main').innerHTML=h;if(view===2)bindForm();
}
var draft=null;
function formHtml(){var x=draft||{tipo:'app',ramo:'',cliente:'',date:iso(new Date()),time:'',nota:''};
 return '<div class="card"><label>Scrivi una frase, come la diresti a voce</label><textarea id="fr" rows="2" placeholder="Domani alle 10 appuntamento con Rossi">'+esc(x.nota)+'</textarea>'+
 '<div class="acts" style="max-width:none"><button class="btn s" id="fmic">&#127908; Detta</button><button class="btn" id="fgo">Capisci</button></div></div>'+
 '<div class="card"><div style="font-weight:600">Controlla e salva</div>'+
 '<label>Tipo</label><select id="ft"><option value="app">Appuntamento</option><option value="pol">Scadenza polizza</option><option value="att">Altra attività</option></select>'+
 '<label>Cliente / titolo</label><input id="fc" value="'+esc(x.cliente)+'">'+
 '<label>Ramo polizza</label><select id="fr2"><option value="">—</option><option>Auto</option><option>Casa</option><option>Vita</option><option>Infortuni</option></select>'+
 '<label>Data</label><input id="fd" type="date" value="'+esc(x.date)+'"><label>Ora</label><input id="fh" type="time" value="'+esc(x.time)+'">'+
 '<div class="err" id="fe"></div><div class="acts" style="max-width:none;margin-top:12px"><button class="btn g" id="fs">Salva</button></div></div>'}
function bindForm(){var x=draft||{tipo:'app',ramo:''};$('ft').value=x.tipo;$('fr2').value=x.ramo||'';
 $('fgo').onclick=function(){var t=$('fr').value.trim();if(!t){$('fe').textContent='Scrivi o detta una frase';return}draft=parse(t);render();toast('Ho capito: '+describe(draft))};
 $('fmic').onclick=function(){listen(function(t){draft=parse(t);render();toast('Ho capito: '+describe(draft))},function(e){toast('Microfono non disponibile: scrivi la frase')})};
 $('fs').onclick=function(){var it={id:uid(),tipo:$('ft').value,ramo:$('fr2').value,cliente:$('fc').value.trim(),date:$('fd').value,time:$('fh').value,nota:($('fr').value||'').trim(),done:false};
  if(!it.date){$('fe').textContent='Scegli la data';return}if(!it.cliente&&!it.nota){$('fe').textContent='Scrivi almeno il cliente o una nota';return}
  db.items.push(it);save();draft=null;view=it.tipo==='pol'?1:0;render();toast('Salvato. Tocca la campanella per avere l\'avviso anche ad app chiusa')}}
function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none'},3500)}

document.addEventListener('click',function(e){var t=e.target.closest('[data-ok],[data-del],[data-f],[data-ics],[data-all]');if(!t)return;
 if(t.dataset.ics){giveIcs(db.items.filter(function(i){return i.id===t.dataset.ics}),'promemoria');return}
 if(t.dataset.all!==undefined){giveIcs(db.items.filter(function(i){return !i.done&&diffDays(i.date)>=0}),'agenda-segretaria');return}
 if(t.dataset.f){filt=t.dataset.f;render();return}
 var id=t.dataset.ok||t.dataset.del;
 if(t.dataset.del){if(!confirm('Eliminare?'))return;db.items=db.items.filter(function(i){return i.id!==id})}
 else db.items.forEach(function(i){if(i.id===id)i.done=true});
 save();render()});
[0,1,2].forEach(function(k){$('n'+k).onclick=function(){view=k;render()}});
$('gear').onclick=function(){var n=prompt('Come ti chiamo?',db.user);if(n){db.user=n.trim();save();render()}
 if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()};

/* ---------- schermata segretaria ---------- */
var pend=null;
function openOv(autoSpeak){$('ov').classList.add('show');$('pv').innerHTML='';pend=null;var b=briefing();$('bub').textContent=b;
 $('mhint').textContent=SR?'Tocca il microfono e dimmi un appuntamento':'Per dettare usa Chrome. Qui puoi scrivere in Aggiungi.';
 if(autoSpeak){var started=false;say(b);setTimeout(function(){if(!speaking){$('bub').textContent=b+'\n\n(Tocca "Riascolta" per sentirmi)'}},1800)}}
$('hav').onclick=function(){openOv(true)};
$('enter').onclick=function(){try{speechSynthesis.cancel();rec&&rec.abort()}catch(e){}mouth(false);$('ov').classList.remove('show');render()};
$('again').onclick=function(){say(briefing())};
$('mic').onclick=function(){
 if(!SR){say('Il microfono non è disponibile qui. Apri l\'app con Chrome.');return}
 if($('mic').classList.contains('live')){rec.stop();return}
 $('pv').innerHTML='';$('bub').textContent='Dimmi pure…';
 listen(function(txt){pend=parse(txt);showPend(txt)},function(e){$('bub').textContent=e==='not-allowed'?'Devo avere il permesso di usare il microfono.':'Non ho sentito, riprova.'})};
function showPend(txt){var d=describe(pend),miss=!pend.date;
 $('bub').textContent='Hai detto: «'+txt+'»\n\nHo capito '+d+'.'+(miss?'\nMi manca la data.':'');
 $('pv').innerHTML='<div class="acts" style="max-width:none">'+(miss?'':'<button class="btn g" id="pyes">Salva</button>')+'<button class="btn s" id="pedit">Modifica</button></div>';
 if(!miss)$('pyes').onclick=confirmPend;$('pedit').onclick=function(){draft=pend;view=2;$('enter').onclick()};
 say('Ho capito '+d+'.'+(miss?' Mi manca la data, dimmela.':' Lo salvo?'),function(){if(miss)return;listen(function(r){r=norm(r);
  if(/\b(si|certo|ok|va bene|salva|confermo)\b/.test(r))confirmPend();else if(/\bno\b|annulla/.test(r)){$('pv').innerHTML='';say('Va bene, non lo salvo.')}},function(){})})}
function confirmPend(){if(!pend)return;pend.id=uid();pend.done=false;db.items.push(pend);save();var d=describe(pend);pend=null;$('pv').innerHTML='';
 $('bub').textContent='Fatto, l\'ho segnato.\n\n'+briefing();say('Fatto, ho segnato '+d+'.')}


/* ---------- calendario (promemoria ad app chiusa) ---------- */
function icsEsc(t){return String(t||'').replace(/\\/g,'\\\\').replace(/[,;]/g,function(c){return '\\'+c}).replace(/\n/g,'\\n')}
function dtp(d,t){return d.replace(/-/g,'')+'T'+(t?t.replace(':','')+'00':'090000')}
function icsEvents(i){var ev=[],lab=(i.ramo?i.ramo.toLowerCase()+' ':'')+(i.cliente||''),now=new Date();
 if(i.tipo==='pol'){[[0,'Scade oggi la polizza '],[3,'Tra 3 giorni scade la polizza '],[15,'Tra 15 giorni scade la polizza '],[30,'Tra 30 giorni scade la polizza ']].forEach(function(r){
   var d=addDays(fromIso(i.date),-r[0]);if(r[0]===0||d>=sod(now))ev.push({s:r[1]+lab,d:iso(d),t:'09:00',a:[0]})})}
 else ev.push({s:(i.tipo==='app'?'Appuntamento: ':'')+(i.cliente||i.nota),d:i.date,t:i.time||'09:00',a:i.time?[60,15]:[0],n:i.nota});
 return ev}
function makeIcs(list){var o=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Segretaria//IT','CALSCALE:GREGORIAN'],st=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
 list.forEach(function(i){icsEvents(i).forEach(function(e,k){var s=dtp(e.d,e.t),en=dtp(e.d,e.t==='23:30'?'23:59':(function(){var p=e.t.split(':');var m=+p[0]*60+ +p[1]+30;return pad(Math.min(23,Math.floor(m/60)))+':'+pad(m%60)})());
  o.push('BEGIN:VEVENT','UID:'+i.id+'-'+k+'@segretaria','DTSTAMP:'+st,'DTSTART:'+s,'DTEND:'+en,'SUMMARY:'+icsEsc(e.s));if(e.n)o.push('DESCRIPTION:'+icsEsc(e.n));
  e.a.forEach(function(m){o.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(e.s),'TRIGGER:-PT'+m+'M','END:VALARM')});o.push('END:VEVENT')})});
 o.push('END:VCALENDAR');return o.join('\r\n')}
function giveIcs(list,name){if(!list.length){toast('Niente da aggiungere');return}
 var b=new Blob([makeIcs(list)],{type:'text/calendar'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'.ics';document.body.appendChild(a);a.click();
 setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},2000);toast('Apri il file scaricato per metterlo nel Calendario')}

/* ---------- promemoria mentre l'app è aperta ---------- */
var told={};
setInterval(function(){var n=new Date(),hm=n.getHours()*60+n.getMinutes(),t=iso(n);
 db.items.forEach(function(i){if(i.done||i.date!==t||!i.time||told[i.id])return;var p=i.time.split(':'),dm=+p[0]*60+ +p[1]-hm;
  if(dm<=15&&dm>=0){told[i.id]=1;var m='Tra '+dm+' minuti: '+(i.cliente||i.nota);toast(m);if(navigator.vibrate)navigator.vibrate([200,100,200]);
   if('Notification' in window&&Notification.permission==='granted'){try{navigator.serviceWorker.ready.then(function(r){r.showNotification('Segretaria',{body:m,icon:'icon-192.png'})})}catch(e){}}}})},30000);

if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(function(){});
render();openOv(true);
document.addEventListener('pointerdown',function f(){document.removeEventListener('pointerdown',f);if($('ov').classList.contains('show')&&!speaking&&!window.__spoke){window.__spoke=1}},{once:true});
</script>
